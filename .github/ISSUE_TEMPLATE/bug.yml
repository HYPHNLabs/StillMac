name: Bug report
description: Report reproducible incorrect behaviour
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private paths, process listings, or other personal data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, without private machine data?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic data where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Revision or version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: macOS version and architecture
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, usernames, private paths, process listings, and personal data.
          required: true
